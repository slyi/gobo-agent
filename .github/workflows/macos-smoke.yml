name: macOS smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/**"
      - "main.gs"
      - "stage.gs"
      - ".github/workflows/macos-smoke.yml"
  pull_request:
    paths:
      - "tools/**"

permissions:
  contents: read

# Keep CI hermetic: install into the checkout's .tools instead of the shared
# per-user home the CLI now defaults to.
env:
  GSDEV_TOOLS: ${{ github.workspace }}/.tools
  GSDEV_PYTHON_DIR: ${{ github.workspace }}/.tools/python

jobs:
  macos:
    # macos-14 is Apple Silicon; the workflow picks the matching goboscript build.
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install prebuilt tools (goboscript + host bundles)
        run: python3 tools/gsdev.py setup

      - name: Ensure Chrome
        run: |
          if [ ! -d "/Applications/Google Chrome.app" ]; then
            brew install --cask google-chrome
          fi

      - name: doctor
        run: python3 tools/gsdev.py doctor

      - name: selftest
        run: python3 tools/gsdev.py selftest

      - name: build
        run: python3 tools/gsdev.py build

      # CDP Chrome on macOS. Runners have no usable GPU, so force software GL.
      - name: run + confirm logs
        run: |
          set -euo pipefail
          python3 tools/gsdev.py run --headless --software --duration 3 --leave-running | tee run.log
          grep -q "\[hello\]" run.log

      - name: input + live edit + pixel (smoke.txt)
        run: python3 tools/gsdev.py session < smoke.txt

      - name: get pixel (CLI)
        run: |
          set -euo pipefail
          python3 tools/gsdev.py pixel 0 0 | tee pixel.json
          grep -q '#4c97ff' pixel.json

      - name: screenshot + confirm size
        run: |
          set -euo pipefail
          python3 tools/gsdev.py screenshot --headless --software --out debug/smoke.png
          python3 - <<'PY'
          import struct
          data = open('debug/smoke.png', 'rb').read()
          assert data[:8] == b'\x89PNG\r\n\x1a\n', 'not a PNG'
          width, height = struct.unpack('>II', data[16:24])
          assert (width, height) == (480, 360), (width, height)
          print('screenshot ok', width, height)
          PY

      - name: close
        run: python3 tools/gsdev.py close

      - name: tasks
        run: python3 tools/gsdev.py tasks --run

      # Adoption path: stand up a project that has no harness, `init` it, and run
      # the adopted runtime end to end.
      - name: adopt a standalone copy (init) and run it
        run: |
          set -euo pipefail
          dst="$(mktemp -d)"
          cp -R assets "$dst/"
          printf 'frame_rate = 30\nstage_width = 480\nstage_height = 360\n' > "$dst/goboscript.toml"
          printf 'costumes "assets/backdrop.svg" as "backdrop";\n' > "$dst/stage.gs"
          printf 'costumes "assets/hello.svg" as "hello";\n\nonflag {\n    log "adopted project running";\n}\n' > "$dst/main.gs"

          python3 tools/gsdev.py init --project "$dst"

          # Tools and host bundles are shared through GSDEV_TOOLS (set at the
          # workflow level), so the adopted project needs no second download.
          rt="$dst/gobo-agent/runtime"
          export GSDEV_PYTHON="$(command -v python3)"
          export GSDEV_TOOLS="$PWD/.tools"

          gs="$rt/tools/gsdev"
          "$gs" build
          "$gs" run --headless --software --duration 3 --leave-running | tee "$dst/adopt-run.log"
          grep -q '\[LOG' "$dst/adopt-run.log"
          "$gs" session --file "$dst/gobo-agent/smoke.txt"
          "$gs" close
          "$gs" test --manifest "$dst/gobo-agent/gobo-tests.json" --headless --software
          "$gs" close

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-stage
          path: debug/*.png
          if-no-files-found: ignore
