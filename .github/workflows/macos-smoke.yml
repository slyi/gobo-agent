name: macOS smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/**"
      - "main.gs"
      - "stage.gs"
      - ".github/workflows/macos-smoke.yml"
  pull_request:
    paths:
      - "tools/**"

permissions:
  contents: read

jobs:
  macos:
    # macos-14 is Apple Silicon; the workflow picks the matching goboscript build.
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install host deps
        run: npm install --prefix tools/scratchhost --no-audit --no-fund

      - name: Ensure Chrome
        run: |
          if [ ! -d "/Applications/Google Chrome.app" ]; then
            brew install --cask google-chrome
          fi

      - name: Install goboscript
        run: |
          set -eux
          arch="$(uname -m)"
          case "$arch" in
            arm64)  asset="goboscript_Darwin_arm64.tar.gz" ;;
            x86_64) asset="goboscript_Darwin_x86_64.tar.gz" ;;
            *) echo "unsupported arch: $arch"; exit 1 ;;
          esac
          curl -sSL -o gs.tar.gz \
            "https://github.com/aspizu/goboscript/releases/download/v3.2.1/${asset}"
          tar xzf gs.tar.gz
          chmod +x goboscript
          sudo mv goboscript /usr/local/bin/goboscript
          goboscript --version

      - name: doctor
        run: python3 tools/gsdev.py doctor

      - name: selftest
        run: python3 tools/gsdev.py selftest

      - name: build
        run: python3 tools/gsdev.py build

      # CDP Chrome on macOS. Runners have no usable GPU, so force software GL.
      - name: run + confirm logs
        run: |
          set -euo pipefail
          python3 tools/gsdev.py run --headless --software --duration 3 --leave-running | tee run.log
          grep -q "\[hello\]" run.log

      - name: input + live edit + pixel (smoke.txt)
        run: python3 tools/gsdev.py session < smoke.txt

      - name: get pixel (CLI)
        run: |
          set -euo pipefail
          python3 tools/gsdev.py pixel 0 0 | tee pixel.json
          grep -q '#4c97ff' pixel.json

      - name: screenshot + confirm size
        run: |
          set -euo pipefail
          python3 tools/gsdev.py screenshot --headless --software --out debug/smoke.png
          python3 - <<'PY'
          import struct
          data = open('debug/smoke.png', 'rb').read()
          assert data[:8] == b'\x89PNG\r\n\x1a\n', 'not a PNG'
          width, height = struct.unpack('>II', data[16:24])
          assert (width, height) == (480, 360), (width, height)
          print('screenshot ok', width, height)
          PY

      - name: close
        run: python3 tools/gsdev.py close

      - name: tasks
        run: python3 tools/gsdev.py tasks --run

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-stage
          path: debug/*.png
          if-no-files-found: ignore
